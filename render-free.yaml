# Free compute profile: no disk. Supply the existing OpenAI key as a server secret.
# Included bandwidth/build allowances still apply at the workspace level.
services:
  - type: web
    name: retail-planner-demo
    runtime: docker
    plan: free
    numInstances: 1
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: RETAIL_SERVE_FRONTEND
        value: "1"
      - key: RETAIL_SECURE_COOKIE
        value: "1"
      - key: RETAIL_EPHEMERAL
        value: "1"
      - key: RETAIL_DB
        value: /tmp/retail.sqlite3
      - key: RETAIL_MAX_BYTES
        value: "10485760"
      - key: RETAIL_MAX_ROWS
        value: "100000"
      - key: RETAIL_MAX_CELLS
        value: "1500000"
      - key: RETAIL_MAX_PRODUCTS
        value: "100"
      - key: RETAIL_MAX_GRID
        value: "100000"
      - key: RETAIL_AI_DAILY_LIMIT
        value: "30"
      - key: RETAIL_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
